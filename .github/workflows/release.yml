# Release omssh: build archives, publish a GitHub release, update the Homebrew
# tap formula.
#
# Triggered by tag, and by workflow_dispatch so a release can be re-run without
# re-tagging. Nothing runs automatically on push.
#
# Needs a repository secret named TAP_GITHUB_TOKEN: a fine-grained PAT with
# "Contents: read and write" on fakihariefnoto/homebrew-tap. The default
# GITHUB_TOKEN cannot push to a second repository, which is why this exists.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The Charm v2 stack requires Go 1.26.
  GO_VERSION: '1.26.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  release:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser needs the full history for the changelog
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
